<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CozyRoom — Decorate Together</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- LOBBY -->
  <div id="lobby" class="screen">
    <h1>🏡 CozyRoom</h1>
    <p class="tagline">Decorate a room together with 2–4 friends</p>
    <div class="card">
      <input id="nameInput" maxlength="16" placeholder="Your name">
      <div class="row">
        <button id="createBtn" class="btn primary">Create Room</button>
      </div>
      <div class="divider">or join with a code</div>
      <div class="row">
        <input id="codeInput" maxlength="6" placeholder="CODE" style="text-transform:uppercase">
        <button id="joinBtn" class="btn">Join</button>
      </div>
      <div id="lobbyError" class="error"></div>
    </div>
  </div>

  <!-- ROOM -->
  <div id="room" class="screen hidden">
    <div class="topbar">
      <div>Room code: <b id="roomCode"></b> <button id="copyBtn" class="btn small">Copy</button></div>
      <button id="leaveBtn" class="btn small danger">Leave</button>
    </div>
    <div id="lobbyView">
      <h2>Waiting room</h2>
      <div id="playersList" class="players"></div>
      <p id="lobbyHint" class="hint"></p>
      <button id="readyBtn" class="btn primary">Ready ✋</button>
      <button id="startBtn" class="btn hidden">Start Decorating ▶</button>
    </div>

    <div id="gameView" class="hidden">
      <div class="palette" id="palette"></div>
      <div class="gamearea">
        <div id="grid" class="grid"></div>
      </div>
      <p class="hint">Select an item, then click a tile to place it. Right-click (or Eraser) to remove. Host can reset.</p>
      <button id="resetBtn" class="btn small hidden">🗑 Reset room</button>
    </div>

    <div class="chatbox">
      <div id="chatLog" class="chatlog"></div>
      <div class="row">
        <input id="chatInput" maxlength="200" placeholder="Message…">
        <button id="sendBtn" class="btn">Send</button>
      </div>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
